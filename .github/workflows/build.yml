name: Java Gradle CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Cache Gradle packages (speeds up future builds)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 5: Run tests
      - name: Run tests
        run: ./gradlew test

      # Step 6: Build the application
      - name: Build with Gradle
        run: ./gradlew build -x test

      # Step 7: Upload JAR as artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-grade-api-jar
          path: build/libs/*.jar
          retention-days: 7

      # Step 8: Show build info
      - name: Display build info
        run: ./gradlew buildInfo
