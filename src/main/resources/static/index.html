<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Management | Live Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --success-color: #10b981;
            --error-color: #ef4444;
            --font-family: 'Outfit', sans-serif;
            --mono-family: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(11, 15, 25, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--success-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 4rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 3rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                padding: 2rem;
            }
            header {
                padding: 1.5rem 2rem;
            }
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .forms-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.875rem 1.25rem;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .accent-btn {
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .accent-btn:hover {
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        .student-list-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-height: 75vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .student-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .student-list-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .student-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }

        .student-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .student-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(99, 102, 241, 0.3);
            transform: scale(1.01);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .student-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .student-roll {
            font-family: var(--mono-family);
            font-size: 0.875rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .delete-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem;
            width: auto;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            color: var(--error-color);
            transform: scale(1.1);
            opacity: 1;
            box-shadow: none;
        }

        .grades-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            padding-top: 1rem;
        }

        .grade-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .grade-subject {
            font-weight: 500;
        }

        .grade-badge-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .grade-score {
            color: var(--text-secondary);
            font-family: var(--mono-family);
            font-size: 0.875rem;
        }

        .letter-badge {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.875rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .badge-a { background: rgba(16, 185, 129, 0.15); color: var(--success-color); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-b { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-c { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-d { background: rgba(239, 68, 68, 0.15); color: var(--error-color); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-f { background: rgba(239, 68, 68, 0.3); color: var(--error-color); border: 1px solid var(--error-color); }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .empty-icon {
            font-size: 3rem;
            opacity: 0.4;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 100;
        }

        .toast {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--card-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            backdrop-filter: blur(8px);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success { border-left: 4px solid var(--success-color); }
        .toast-error { border-left: 4px solid var(--error-color); }

        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-icon">&#127891;</span>
            <span class="logo-title">GradeAPI Live Client</span>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>API Online</span>
        </div>
    </header>

    <main>
        <div class="forms-column">
            <!-- Add Student Panel -->
            <div class="panel">
                <h2 class="section-title">Add New Student</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" placeholder="e.g. Konda Balaji Rao" required>
                    </div>
                    <div class="form-group">
                        <label for="studentRoll">Roll Number</label>
                        <input type="text" id="studentRoll" placeholder="e.g. CS2026108" required>
                    </div>
                    <button type="submit">Register Student</button>
                </form>
            </div>

            <!-- Add Grade Panel -->
            <div class="panel">
                <h2 class="section-title">Record Grade</h2>
                <form id="gradeForm">
                    <div class="form-group">
                        <label for="gradeStudentSelect">Select Student</label>
                        <select id="gradeStudentSelect" required>
                            <option value="" disabled selected>Choose a student...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gradeSubject">Subject</label>
                        <input type="text" id="gradeSubject" placeholder="e.g. Distributed Systems" required>
                    </div>
                    <div class="form-group">
                        <label for="gradeScore">Score (0 - 100)</label>
                        <input type="number" id="gradeScore" min="0" max="100" placeholder="e.g. 95" required>
                    </div>
                    <button type="submit" class="accent-btn">Add Subject Grade</button>
                </form>
            </div>
        </div>

        <!-- Live Output Dashboard -->
        <div class="panel" style="display: flex; flex-direction: column;">
            <h2 class="section-title">Active Student Roster</h2>
            <div id="studentList" class="student-list-container">
                <div class="empty-state">
                    <div class="empty-icon">&#128196;</div>
                    <p>No students registered yet.</p>
                    <p style="font-size: 0.875rem;">Register a student using the form on the left to get started.</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Student Grade API Live Console. Designed with Outfit.</p>
    </footer>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        const API_BASE = '/api';

        // Elements
        const studentForm = document.getElementById('studentForm');
        const gradeForm = document.getElementById('gradeForm');
        const studentList = document.getElementById('studentList');
        const studentSelect = document.getElementById('gradeStudentSelect');
        const toastContainer = document.getElementById('toastContainer');

        // Initial Load
        document.addEventListener('DOMContentLoaded', fetchStudents);

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '&#9989;' : '&#10060;'}</span>
                <span>${message}</span>
            `;
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove toast
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Fetch Students & Grades
        async function fetchStudents() {
            try {
                const response = await fetch(`${API_BASE}/students`);
                if (!response.ok) throw new Error('Failed to fetch students roster');
                const students = await response.json();
                renderStudents(students);
                populateStudentSelect(students);
            } catch (error) {
                console.error(error);
                showToast(error.message, 'error');
            }
        }

        // Populate drop-down select list
        function populateStudentSelect(students) {
            const currentSelected = studentSelect.value;
            studentSelect.innerHTML = '<option value="" disabled selected>Choose a student...</option>';
            students.forEach(student => {
                const opt = document.createElement('option');
                opt.value = student.id;
                opt.textContent = `${student.name} (${student.rollNumber})`;
                studentSelect.appendChild(opt);
            });
            if (currentSelected && [...studentSelect.options].some(o => o.value === currentSelected)) {
                studentSelect.value = currentSelected;
            }
        }

        // Get Letter Grade Class
        function getLetterBadgeClass(letter) {
            if (!letter) return 'badge-f';
            const char = letter.charAt(0).toLowerCase();
            return `badge-${char}`;
        }

        // Render roster card templates
        function renderStudents(students) {
            if (students.length === 0) {
                studentList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">&#128196;</div>
                        <p>No students registered yet.</p>
                        <p style="font-size: 0.875rem;">Register a student using the form on the left to get started.</p>
                    </div>
                `;
                return;
            }

            studentList.innerHTML = '';
            students.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                
                let gradesHtml = '';
                if (student.grades && student.grades.length > 0) {
                    gradesHtml = `
                        <div class="grades-section">
                            ${student.grades.map(grade => `
                                <div class="grade-row">
                                    <span class="grade-subject">${grade.subject}</span>
                                    <div class="grade-badge-container">
                                        <span class="grade-score">${grade.score}/100</span>
                                        <span class="letter-badge ${getLetterBadgeClass(grade.letterGrade)}">${grade.letterGrade || 'F'}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    gradesHtml = `
                        <div class="grades-section" style="color: var(--text-secondary); font-size: 0.875rem; font-style: italic;">
                            No recorded subject grades yet.
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="student-header">
                        <div>
                            <div class="student-name">${student.name}</div>
                            <span class="student-roll">${student.rollNumber}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteStudent(${student.id})" title="Delete Student">&times;</button>
                    </div>
                    ${gradesHtml}
                `;
                studentList.appendChild(card);
            });
        }

        // Submit student
        studentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('studentName');
            const rollInput = document.getElementById('studentRoll');
            
            const payload = {
                name: nameInput.value.trim(),
                rollNumber: rollInput.value.trim()
            };

            try {
                const response = await fetch(`${API_BASE}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(errorMsg || 'Failed to create student');
                }
                
                showToast('Student registered successfully!');
                nameInput.value = '';
                rollInput.value = '';
                fetchStudents();
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        // Submit grade
        gradeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = studentSelect.value;
            const subjectInput = document.getElementById('gradeSubject');
            const scoreInput = document.getElementById('gradeScore');

            const payload = {
                subject: subjectInput.value.trim(),
                score: parseInt(scoreInput.value)
            };

            try {
                const response = await fetch(`${API_BASE}/students/${studentId}/grades`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(errorMsg || 'Failed to record grade');
                }

                showToast('Grade recorded successfully!');
                subjectInput.value = '';
                scoreInput.value = '';
                fetchStudents();
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        // Delete Student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student and all their grades?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/students/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(errorMsg || 'Failed to delete student');
                }

                showToast('Student deleted successfully');
                fetchStudents();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>
</html>
